<!DOCTYPE html>
<html lang="en" translate="yes">
    <head>
        <meta charset="utf-8">
        <title>Chibis :3</title>
        <meta description="FogStuff super secret page">
        <meta name="viewport" content="width=device-width, minimum-scale=1.0, maximum-scale=5.0, initial-scale=1.0">
        <link rel="icon" href="./icon.png">
    </head>
    <body>
        <main>
            <div>
                <div class="CharacterSpawnerDiv">
                    <img draggable="false" src="./sprites/sayori/default.png">
                    <span>Sayori</span>
                    <button id="SpawnButton">spawn</button>
                </div>
            </div>
        </main>
        <style>
            body{
                background-color: #2d2d2d;
                font-family: Arial, Helvetica, sans-serif;
                color: white;
                display: block;
                justify-content: normal;
                align-content: normal;
            }
            button{
                cursor: pointer;
            }
            .CharacterSpawnerDiv{
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-content: center;
                width: 200px;
                height: 300px;
                background-color: rgb(249, 129, 199);
                border: solid;
                border-width: 1px;
                border-color: white;
            }
            .CharacterSpawnerDiv span{
                display: inline-block;
                text-align: center;
                margin-left: auto;
                margin-right: auto;
            }
            .CharacterSpawnerDiv img{
                margin-left: auto;
                margin-right: auto;
            }
            .CharacterSpawnerDiv button{
                width: 100px;
                margin-left: auto;
                margin-right: auto;
            }
        </style>
        <script>
const button = document.getElementById("SpawnButton");
button.addEventListener("click",function(ev){
    window.open("./mascot.html","dokiWindow","left=100,top=100,width=200,height=200")
})
        </script>
    </body>
</html>
