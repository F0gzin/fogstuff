<!DOCTYPE html>
<html lang="en">
    <head>
        <title>MASCOT</title>
        <meta charset="utf-8">
    </head>
    <body>
        <center>
            <img draggable="false" class="notselectable" src="./sprites/sayori/happy.png">
        </center>
        <style>
            body{
                background-color: black;
            }
            #notselectable {
            -webkit-user-select: none; 
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            }
        </style>
        <script>
            let lastUpdate = 0;
            let lastTime = performance.now();
            const FPS = 30;
            const FRAME_DURATION = 1000 / FPS;
            const windowNonClientOffsetX = 12;
            const windowNonClientOffsetY = 66;
            let state = "wondering";

            let isMouseDown = false;
            let starterX = 0;
            let starterY = 0;
            let mouseScreenX = 0;
            let mouseScreenY = 0;

            function tick(){
                if(isMouseDown){
                    window.moveTo(mouseScreenX-starterX-windowNonClientOffsetX,mouseScreenY-starterY-windowNonClientOffsetY);
                }
                
            }

            function mainLoop(currentTime){
                requestAnimationFrame(mainLoop);
                const elapsed = currentTime - lastTime;
                if(elapsed >= FRAME_DURATION){
                    tick();
                }
            }

            document.addEventListener("mousedown",function(ev){
                starterX = ev.offsetX;
                starterY = ev.offsetY;
                isMouseDown = true;
                console.log(ev);
            });
            document.addEventListener("mouseup",function(ev){
                isMouseDown = false;
            })
            document.addEventListener("mousemove",function(ev){
                mouseScreenX = ev.screenX;
                mouseScreenY = ev.screenY;
            })
            document.addEventListener("click",function(){

            })

            requestAnimationFrame(mainLoop);
        </script>
    </body>
</html>
