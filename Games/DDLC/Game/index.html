<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FogStuff's DDLC launcher</title>
        <link rel="icon" href="./Icon.png">
    </head>

    <body>
        <h1>FogStuff's DDLC launcher</h1>
        <div style="position:relative;left:0px;top:0px;width:100%;height:100%;display:grid-flex;padding:3px;align-content:end;">
            <select id="Select" style="background-color:#ffffff;cursor:pointer;width:200px;height:40px;font-style:oblique;font-weight: 100;font-size: medium;font-family: 'Comic Sans MS', Cursive, Arial;" id="version_selector" name="version_selector">
                <option value="Recreation">Web &quot;recreation&quot; by Fog (Ren'py-JS)</option>
                <option value="WebPyGame">Web PyGame &lpar;PyJS &plus; PygameHTML&rpar;</option>
                <option value="RenPy">Ren'Py HTML5 build</option>
                <option value="Emulation">Emulated (WebWine)</option>
            </select>
            <button onclick="Clicked();" style="background-color:#ffffff;cursor:pointer;width:200px;height:40px;font-style:oblique;font-weight: 100;font-size: medium;font-family: 'Comic Sans MS', Cursive, Arial;">Play it!</button>
        </div>
    </body>

    <script type="application/javascript">

var selected = "Recreation";
var dropdown = document.getElementById("Select");
dropdown.addEventListener("change",function(ev){
    selected = ev.target.value;
});

function Clicked(){
    var select = document.getElementById("Select");
    if(selected === "Recreation"){
        var newA = document.createElement("a");
        newA.href = "./RPJS";
        newA.click();
    }else{
        document.body.innerHTML = "<center><font size=+2 color=red><strong><u>go fuck yourself</u></strong></font></center>";
    }
}

    </script>

    <style>
        body{
            display: block;
            font-family: 'Arial', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            background-image: url("../../../Assets/GameImages/DDLC/Launcher.png");
            background-size: 100%;
            background-repeat: no-repeat;
        }
    </style>
</html>
