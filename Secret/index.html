<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="../Assets/google_favicon.ico">
    <link rel="stylesheet" href="../Css/Main.css">
    <title>Google</title>
</head>
<body>
    <header id="PageHeader">
        <center>
            <a href="..">
                <img id="PageLogo" src="../Assets/Logo/White.svg" alt="FogStuff logo">
            </a>
        </center>
        <marquee scrollamount="19">
            <span>Tsundere simulator</span>
        </marquee>
    </header>
    <div id="NatsukiHolder">
        <button id="NatsukiButton" title="Natsuki">
            <img id="NatsukiImg" alt="NATSUKI SPRITE" src="./Natsuki/Regular_Blushed.png">
        </button>
    </div>
    <style>
        body{
            height: 100vh !important;
            overflow-y: hidden;
        }
        #NatsukiButton{
            display: flex;
            background-color: rgba(0, 0, 0, 0); 
            border: none;
            margin-left: auto;
            margin-right: auto;
            margin-top: auto;
            width: fit-content;
            height: fit-content;
        }
        #NatsukiHolder{
            display: flex;
            position: absolute;
            bottom: 0px;
            width: 100%;
            
        }
        #NatsukiImg{
            display: inline-block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
    <script>
        const button = document.getElementById("NatsukiButton");
        const image = document.getElementById("NatsukiImg");
        const defaultImg = image.src;

        button.onclick = function(ev){
            image.src = "./Natsuki/Tsundere1.png";
            alert("Hmph! S-Stop touching me~!");
            setTimeout(function(){
                image.src = defaultImg;
            }, 1000);
        }
    </script>
</body>
</html>
