<head>
    <meta charset="utf-8">
    <title>Google</title>
    <link rel="stylesheet" href="../../Css/Main.css" >
</head>
<body>
    <header id="PageHeader">
        <center>
            <a href="../../">
                <img id="PageLogo" src="../../Assets/Logo/White.svg" alt="FogStuff logo">
            </a>
        </center>
        <marquee scrollamount="19">
            <span>what u coding bro?</span>
        </marquee>
    </header>
    <div>
        <a href="../../Code#Tutorials">
            <button>Tutorials</button>
        </a>
        <br>
        <hr>
        <span>
            Here you can do web-dev shit, that is HTML5 (HTML, JS, CSS, WASM, WebGL etc.)<br>
            But with none of this React bullcrap and a gazillion frameworks, thats OG plain HTML and JS just like god intented.<br>

        <br>
        <hr>
        <br>
        <div id="ScriptAreaContainer">
            <div id="CodeTextAreaParent">
                <textarea id="CodeTextArea">
&lt;!DOCTYPE html&gt;
&lt;html lang="en"&gt;

&lt;head&gt;
   &lt;meta charset="utf-8"&gt;
   &lt;title&gt;Webpage&lt;/title&gt;
&lt;/head&gt;

&lt;body&gt;
   &lt;div&gt;
      &lt;h1&gt;WELCOME!&lt;/h1&gt;
      &lt;br&gt;
      this is my page ;)
   &lt;/div&gt;

   &lt;script type="text/javascript"&gt;
      console.log("Hello, World!");
   &lt;/script&gt;
&lt;/body&gt;

&lt;/html&gt;
                </textarea>
            </div>
            <canvas id="CodeCanvas" width="640" height="480"></canvas>
        </div>
        <hr>
        <button>Run!</button>
    </div>
    <style>
        #ScriptAreaContainer{
            background-color: blue;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
            width: 600px;
            height: 480px;
        }
        #ScriptAreaContainer *{
            grid-area: 1 / 1;
        }
        #CodeTextAreaParent{
            display: inline-block;
            position: inherit;
            z-index: 0;
            width: calc(100% - 8px);
            height: calc(100% - 8px);
            margin: 0px;
        }
        #CodeTextArea{
            margin-left: 32px;
            margin-top: -7px;
            top: 0px;
            z-index: 0;
            width: calc(100% - 8px);
            height: calc(100% - 8px);
            opacity: 0%;
        }
        #ScriptAreaContainer canvas{
            display: inline-block;
            position: inherit;
            background-color: pink;
            left: 0px;
            z-index: 2;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
    
    <script type="module">
        const canvas = document.getElementById("CodeCanvas");
        const ctx = canvas.getContext("2d");
        const textarea = document.getElementById("CodeTextArea");
        
        const fontstyle = "24px monospace";
        const charWidth = 13.2;
        const charHeight = 24;

        ctx.font = fontstyle;
        textarea.style.font = "22.7px monospace";
        ctx.textBaseline = "top"; 

        const offs = 40;

        function fram(time){
            const lines = textarea.value.split("\n");

            ctx.fillStyle = `rgb(10, 10, 10)`;
            ctx.fillRect(0,0,640,680);
            
            const textUpToCaret = textarea.value.substring(0, textarea.selectionEnd);
            const linesB = textUpToCaret.split('\n');
            const currentLineNumber = linesB.length-1;

            let currentColumnNumber = 0;
            for(let i=0; i<linesB.length-1; i++){
                currentColumnNumber += linesB[i].length+1;
            }

            const startPosN = textarea.selectionStart - currentColumnNumber;
            const endPosN = textarea.selectionEnd - currentColumnNumber;
            
            ctx.fillStyle = `rgb(0, 255, 255)`;
            ctx.fillRect((startPosN*charWidth)+offs,currentLineNumber*charHeight,(endPosN-startPosN)*charWidth,charHeight);
            
            ctx.fillStyle = "rgb(255, 255, 255)";
            ctx.fillRect((endPosN*charWidth)+offs,currentLineNumber*charHeight,1,charHeight);
            for(let i=0; i<lines.length; i++){
                ctx.fillText(`${i+1}`, 0, i*24);
                ctx.fillRect(30,0,2,640);
                ctx.fillText(lines[i], offs, i*24);
            }

            requestAnimationFrame(fram);
        }

        requestAnimationFrame(fram);
    </script>
</body>
</html>
