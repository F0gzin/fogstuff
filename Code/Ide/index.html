&lt;!DOCTYPE html&gt;

    <style>
        #ScriptAreaContainer{
            background-color: blue;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
            width: 600px;
            height: 480px;
        }
        #ScriptAreaContainer *{
            grid-area: 1 / 1;
        }
        #CodeTextAreaParent{
            display: inline-block;
            position: inherit;
            z-index: 0;
            width: calc(100% - 8px);
            height: calc(100% - 8px);
            margin: 0px;
        }
        #CodeTextArea{
            margin-left: 32px;
            margin-top: -7px;
            top: 0px;
            z-index: 0;
            width: calc(100% - 8px);
            height: calc(100% - 8px);
            opacity: 0%;
        }
        #ScriptAreaContainer canvas{
            display: inline-block;
            position: inherit;
            background-color: pink;
            left: 0px;
            z-index: 2;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
    <script src="fengari-web.js" type="text/javascript"></script>
    <script type="application/lua">
    </script>
    <script type="module">
        const luaconf  = fengari.luaconf;
        const lua      = fengari.lua;
        const lauxlib  = fengari.lauxlib;
        const lualib   = fengari.lualib;

        const L = lauxlib.luaL_newstate();

        lualib.luaL_openlibs(L);

        const code = `print(tostring(0/0)); print(tostring(1000e100000))`;
        const encodedCode = fengari.to_luastring(code);
        if (lauxlib.luaL_dostring(L, encodedCode) !== lua.LUA_OK) {
            let errorMsg = lua.lua_tostring(L, -1);
            console.error("Lua Error:", String.fromCharCode(...errorMsg));
        }

        const canvas = document.getElementById("CodeCanvas");
        const ctx = canvas.getContext("2d");
        const textarea = document.getElementById("CodeTextArea");
        
        const fontstyle = "24px monospace";
        const charWidth = 13.2;
        const charHeight = 24;

        ctx.font = fontstyle;
        textarea.style.font = "22.7px monospace";
        ctx.textBaseline = "top"; 

        const offs = 40;

        function fram(time){
            const lines = textarea.value.split("\n");

            ctx.fillStyle = `rgb(10, 10, 10)`;
            ctx.fillRect(0,0,640,680);
            
            const textUpToCaret = textarea.value.substring(0, textarea.selectionEnd);
            const linesB = textUpToCaret.split('\n');
            const currentLineNumber = linesB.length-1;

            let currentColumnNumber = 0;
            for(let i=0; i<linesB.length-1; i++){
                currentColumnNumber += linesB[i].length+1;
            }

            const startPosN = textarea.selectionStart - currentColumnNumber;
            const endPosN = textarea.selectionEnd - currentColumnNumber;
            
            ctx.fillStyle = `rgb(0, 255, 255)`;
            ctx.fillRect((startPosN*charWidth)+offs,currentLineNumber*charHeight,(endPosN-startPosN)*charWidth,charHeight);
            
            ctx.fillStyle = "rgb(255, 255, 255)";
            ctx.fillRect((endPosN*charWidth)+offs,currentLineNumber*charHeight,1,charHeight);
            for(let i=0; i<lines.length; i++){
                ctx.fillText(`${i+1}`, 0, i*24);
                ctx.fillRect(30,0,2,640);
                ctx.fillText(lines[i], offs, i*24);
            }

            requestAnimationFrame(fram);
        }

        requestAnimationFrame(fram);
    </script>
</body>
