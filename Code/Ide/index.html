&lt;!DOCTYPE html&gt;
&lt;html lang="en"&gt;

   &lt;div&gt;

    <style>
        #ScriptAreaContainer{
            display: block;
        }

        #CodeTextArea{
            display: flex;
            margin-left: 0;
            margin-top: 0;
            top: 0px;
            z-index: 0;
            width: 600px;
            height: 600px;
   
        }

    </style>
    
    <script type="application/javascript">
        const button = document.getElementById("RunButton");
        const textbox = document.getElementById("CodeTextArea");
        button.onclick = function(ev){
            const tab = window.open("", "_blank");
            tab.document.write(textbox.value);
            tab.document.close();
        }
    </script>
